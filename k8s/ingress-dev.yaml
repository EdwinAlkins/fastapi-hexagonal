# Expose les consoles de dev via des hostnames dédiés (pas de port-forward).
# Nécessite que ces noms résolvent vers 127.0.0.1 :
#   - avec systemd-resolved, *.localhost est déjà résolu en loopback ;
#   - sinon, ajouter dans /etc/hosts :
#       127.0.0.1  mailpit.localhost rabbitmq.localhost redisinsight.localhost prometheus.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager-dev-ingress
  namespace: task-manager
spec:
  ingressClassName: nginx
  rules:
  - host: mailpit.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailpit
            port:
              number: 8025
  - host: rabbitmq.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq
            port:
              number: 15672
  - host: redisinsight.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redisinsight
            port:
              number: 5540
  - host: prometheus.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
