# PodDisruptionBudget : au moins 1 pod reste disponible pour chaque workload
# pendant une éviction passant par l'API Eviction (kubectl drain, autoscaler).
# ⚠️ Un rolling update de Deployment et `kubectl rollout restart` NE consultent
# PAS le PDB : ils sont pilotés par maxUnavailable / maxSurge et les sondes de
# readiness. Une suppression directe de pod le contourne également.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: task-manager
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: task-manager
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: frontend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mail-worker
  namespace: task-manager
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: mail-worker }
