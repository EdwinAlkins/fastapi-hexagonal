# Secrets de l'application.
#
# ⚠️ Ce fichier ne contient QU'UNE clé, et c'est intentionnel. Les identifiants
# des deux services à état ne sont PAS ici : ils sont générés par leurs
# opérateurs, et les dupliquer ici créerait deux sources de vérité dont une
# fausse.
#
#   PostgreSQL → secret `task-manager-db-app`   (généré par CloudNativePG)
#   RabbitMQ   → secret `rabbitmq-default-user` (généré par l'opérateur RabbitMQ)
#
# C'est de ces deux secrets-là que les Deployments api/worker tirent leurs
# variables (`secretKeyRef`), pas de celui-ci — voir api-deployment.yaml.
#
# POC uniquement : ne pas committer de vrais mots de passe.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: task-manager
type: Opaque
stringData:
  # Chiffre les connexions pré-enregistrées de RedisInsight (cf. infra.yaml).
  # Seule clé de ce secret réellement consommée.
  REDISINSIGHT_ENCRYPTION_KEY: change-me
