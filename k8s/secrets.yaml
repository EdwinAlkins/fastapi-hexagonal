# Identifiants RabbitMQ, référencés par l'API et le worker.
# Le secret Postgres (task-manager-db-app) est généré automatiquement par CNPG.
# POC uniquement : ne pas committer de vrais mots de passe.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: task-manager
type: Opaque
stringData:
  RABBITMQ_USER: task_manager
  RABBITMQ_PASSWORD: change-me
  # Chiffre les connexions pré-enregistrées de RedisInsight (cf. compose).
  REDISINSIGHT_ENCRYPTION_KEY: change-me
