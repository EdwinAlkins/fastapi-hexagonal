# API FastAPI (Gunicorn/Uvicorn). Reprend le bloc `api` du compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: task-manager
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Identité dédiée, sans jeton monté : l'API ne parle jamais à l'API server
      # (cf. k8s/rbac.yaml).
      serviceAccountName: api
      # Durcissement : l'image backend n'a pas de USER → sans ça, le pod tourne
      # en root. On force un UID non-root + seccomp par défaut.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Anti-affinité « préférée » : évite de placer les 2 replicas sur le même
      # nœud → la perte d'un nœud laisse au moins un pod API debout.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: api }
      containers:
      - name: api
        image: task-manager-api:latest
        imagePullPolicy: IfNotPresent   # image chargée via `kind load`, pas de registry
        # Durcissement conteneur : FS racine en lecture seule, aucune capability,
        # pas d'escalade de privilèges. /tmp est monté en écriture (gunicorn y met
        # ses fichiers de heartbeat worker).
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command:
          - gunicorn
          - task_manager.main:app
          - -k
          - uvicorn.workers.UvicornWorker
          - --bind
          - 0.0.0.0:8000
          - --workers
          - "2"
        ports:
        - containerPort: 8000
        env:
        # Secrets d'abord : ils sont référencés par les URLs ci-dessous.
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: task-manager-db-app, key: password }
        # Credentials générés par l'opérateur RabbitMQ (secret rabbitmq-default-user).
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef: { name: rabbitmq-default-user, key: username }
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef: { name: rabbitmq-default-user, key: password }
        # URLs interpolées : $(VAR) n'est expansé que dans un env[].value.
        # Pooler PgBouncer en mode transaction → prepared_statement_cache_size=0.
        - name: APP_DATABASE_URL
          value: "postgresql+asyncpg://task_manager:$(DB_PASSWORD)@task-manager-pooler:5432/task_manager?prepared_statement_cache_size=0"
        - name: APP_RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
        # HOME/TMPDIR sur /tmp : évite toute écriture dans le FS racine (read-only).
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        envFrom:
        - configMapRef: { name: api-config }
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests: { cpu: 50m, memory: 300Mi }
          limits: { cpu: 500m, memory: 612Mi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-manager
spec:
  selector: { app: api }
  ports:
  - port: 8000
    targetPort: 8000
