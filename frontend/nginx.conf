server {
    # 8080 : nginx-unprivileged tourne en non-root et ne peut pas binder < 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes front renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API (même origine en production si le front et l'API
    # sont exposés derrière le même reverse-proxy).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
